<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>그림 미리보기</title>
<style>
  body { background: #1b1b22; color: #ddd; font-family: sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  figure { margin: 0; }
  canvas { image-rendering: pixelated; display: inline-block; margin-right: 4px; }
  figcaption { font-size: 13px; max-width: 420px; }
</style>
<body>
<script src="../js/pictures.js"></script>
<script>
  // 왼쪽은 완성본, 오른쪽은 게임에서 보이는 회색 미완성본.
  const gray = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const l = Math.round(0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255));
    return `rgb(${l},${l},${l})`;
  };
  for (const p of PICTURES) {
    const figure = document.createElement('figure');
    for (const color of [(c) => c, gray]) {
      const scale = Math.floor(192 / p.tier);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = p.tier * scale;
      const ctx = canvas.getContext('2d');
      p.rows.forEach((row, y) => [...row].forEach((ch, x) => {
        ctx.fillStyle = color(p.palette[parseInt(ch, 16)]);
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }));
      figure.append(canvas);
    }
    const caption = document.createElement('figcaption');
    caption.textContent = `${p.title}, ${p.artist}, ${p.year} (${p.tier}x${p.tier})`;
    figure.append(caption);
    document.body.append(figure);
  }
</script>
</body>
</html>
