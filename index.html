<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>별이 빛나는 밤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <h1>별이 빛나는 밤</h1>
    <div class="stat"><span class="label">포인트</span><strong id="points">0</strong></div>
    <div class="stat"><span class="label">손</span><strong id="hand">0</strong><span class="label" id="handBudget"></span></div>
    <div class="stat"><span class="label">요정</span><strong id="fairy">아직 없음</strong></div>
    <div class="stat wide"><strong id="percent">0.00%</strong><span class="label" id="count"></span></div>
    <button id="openSettings" type="button">설정</button>
  </header>

  <main>
    <section id="stage" aria-label="그림">
      <canvas id="view" aria-label="복원 중인 그림. 왼쪽 버튼으로 누르거나 끌어서 칠하고, 휠로 확대하고, 오른쪽 버튼이나 스페이스를 누른 채 끌어서 옮깁니다."></canvas>
      <div id="toasts" aria-live="polite"></div>
      <p id="hint" class="label">왼쪽 버튼: 칠하기, 휠: 확대, 오른쪽 버튼 또는 스페이스+끌기: 옮기기</p>
      <div id="stale" class="notice" hidden role="alert">
        <h2>다른 탭에서 게임을 저장했습니다</h2>
        <p>이 탭의 진행은 이제 저장되지 않습니다. 새로 고쳐서 최신 진행을 불러오세요.</p>
        <button id="reloadStale" type="button" class="primary">새로 고침</button>
      </div>
      <div id="finish" class="notice" hidden>
        <h2>모든 픽셀을 되살렸습니다</h2>
        <p id="finishText"></p>
        <button id="closeFinish" type="button" class="primary">그림 감상하기</button>
      </div>
    </section>

    <aside id="panel">
      <canvas id="minimap" aria-label="전체 지도. 누르면 그 자리로 옮깁니다."></canvas>
      <div id="list"></div>
    </aside>
  </main>

  <dialog id="settings">
    <h2>설정</h2>
    <p class="label">진행은 이 브라우저에 자동으로 저장됩니다. 다른 곳으로 옮기려면 내보내기를 쓰세요.</p>
    <textarea id="saveText" rows="5" aria-label="저장 문자열" spellcheck="false"></textarea>
    <p id="settingsMessage" role="status"></p>
    <div class="row">
      <button id="exportSave" type="button">문자열 내보내기</button>
      <button id="downloadSave" type="button">파일로 받기</button>
      <button id="importSave" type="button">문자열 가져오기</button>
      <button id="importFile" type="button">파일에서 불러오기</button>
      <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
    </div>
    <div class="row end">
      <button id="resetSave" type="button" class="danger">초기화</button>
      <button id="closeSettings" type="button">닫기</button>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/painting-image.js"></script>
  <script src="js/game.js"></script>
  <script src="js/save.js"></script>
  <script src="js/living.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
